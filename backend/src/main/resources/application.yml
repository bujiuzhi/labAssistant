server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8000}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: materials-lab-api
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:15432}/${POSTGRES_DB:materials_lab}}
    username: ${POSTGRES_USER:materials_lab}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

materials-lab:
  development-password: ${MATERIALS_LAB_DEVELOPMENT_PASSWORD:00000000}
  object-storage:
    enabled: ${OBJECT_STORAGE_ENABLED:false}
    endpoint-url: ${OBJECT_STORAGE_ENDPOINT_URL:http://127.0.0.1:19000}
    bucket-name: ${OBJECT_STORAGE_BUCKET_NAME:materials-lab-assistant}

logging:
  level:
    com.materialslab: INFO
