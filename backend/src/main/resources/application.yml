server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8000}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: materials-lab-api
  profiles:
    default: dev
  flyway:
    # 迁移由 SchemaMigrationInitializer 统一执行，避免自动配置与启动 Runner 重复迁移。
    enabled: false
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 27MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.materialslab.api.common.mybatis
  configuration:
    map-underscore-to-camel-case: true

materials-lab:
  development-password: ${MATERIALS_LAB_DEVELOPMENT_PASSWORD:00000000}
  object-storage:
    enabled: ${OBJECT_STORAGE_ENABLED:true}
    endpoint-url: ${OBJECT_STORAGE_ENDPOINT_URL:http://127.0.0.1:19000}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    bucket-name: ${OBJECT_STORAGE_BUCKET_NAME:materials-lab-assistant}
    region: ${OBJECT_STORAGE_REGION:us-east-1}

logging:
  level:
    com.materialslab: INFO
