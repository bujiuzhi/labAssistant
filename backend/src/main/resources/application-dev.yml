spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:15432}/${POSTGRES_DEV_DB:materials_lab_dev}}
    username: ${POSTGRES_DEV_USER:materials_lab}
    password: ${POSTGRES_DEV_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      connection-timeout: 5000
