server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}

spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${POSTGRES_PROD_USER}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:20}
      connection-timeout: 5000
      connection-init-sql: SET TIME ZONE 'Asia/Shanghai'
