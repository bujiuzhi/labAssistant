spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_PROD_DB:materials_lab}}
    username: ${POSTGRES_PROD_USER:materials_lab}
    password: ${POSTGRES_PROD_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:20}
      connection-timeout: 5000
