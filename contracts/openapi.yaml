        name:
          type: string
          minLength: 1
          maxLength: 200
        project_type_code:
          $ref: "#/components/schemas/ProjectType"
        description:
          type: string
          maxLength: 10000
        owner_id:
          type: string
          format: uuid
        member_ids:
          type: array
