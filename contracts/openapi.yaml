      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        username:
          type: string
        display_name:
          type: string
    OrganizationUserOptionListResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationUserOption"
        request_id:
          $ref: "#/components/schemas/Uuid"
    ProjectMember:
      type: object
      required: [id, project_id, user_id, member_role, joined_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        project_id:
          $ref: "#/components/schemas/Uuid"
        user_id:
          $ref: "#/components/schemas/Uuid"
        member_role:
          $ref: "#/components/schemas/ProjectMemberRole"
        joined_at:
          $ref: "#/components/schemas/DateTime"
    ProjectMemberCreate:
      type: object
      additionalProperties: false
      required: [user_id, member_role]
      properties:
        user_id:
          $ref: "#/components/schemas/Uuid"
        member_role:
          $ref: "#/components/schemas/ProjectMemberRole"
    ProjectMemberResponse:
