openapi: 3.1.0
info:
  title: 材料实验助手 API
  version: 1.0.0
  description: |
    仅描述当前代码已经实现的会话、用户、工作台、项目、文档、实验和电子实验记录本接口。
    数据资产与任务管理仍为原型中的研发中页签，不提供 API。
servers:
  - url: /api/v1
    description: 当前同源环境
tags:
  - name: Health
    description: 服务健康检查
  - name: Auth
    description: 会话与超级管理员用户管理
  - name: Dashboard
    description: 实时工作台统计
  - name: Projects
    description: 项目、里程碑、成员、归档和操作记录
  - name: Documents
    description: 项目文档上传、下载与真实预览
  - name: Experiments
    description: 实验计划、电子实验记录本和真实附件
security:
  - cookieAuth: []
paths:
  /health/live:
    get:
      tags: [Health]
      summary: 检查进程存活
      security: []
      responses:
        "200":
          description: 服务进程正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      tags: [Health]
      summary: 检查数据库和对象存储就绪
      security: []
      responses:
        "200":
          description: 服务依赖正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 数据库或对象存储依赖未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/csrf:
    get:
      tags: [Auth]
      summary: 获取 CSRF 令牌
      security: []
      responses:
        "200":
          description: 设置 CSRF Cookie 并返回令牌
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [csrf_token]
                    properties:
                      csrf_token:
                        type: string
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 64
                password:
                  type: string
                  format: password
                  maxLength: 256
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前会话
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "204":
          description: 注销成功
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/session:
    get:
      tags: [Auth]
      summary: 获取当前会话
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/users/options:
    get:
      tags: [Auth]
      summary: 查询可选负责人和成员
      description: 返回本人组织及下级组织中的有效用户。
      responses:
        "200":
          description: 用户选项
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOptionListResponse"
  /auth/users:
    get:
      tags: [Auth]
      summary: 分页查询当前组织用户
      description: 仅超级管理员。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: role_code
          in: query
          schema:
            $ref: "#/components/schemas/AssignableRoleCode"
      responses:
        "200":
          description: 用户分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUserListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Auth]
      summary: 创建组织用户
      description: 仅超级管理员；密码至少 8 位。
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedUserCreate"
      responses:
        "201":
          description: 用户创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Auth]
      summary: 查询组织用户详情
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUserResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Auth]
      summary: 更新组织用户
      description: 可更新用户名、显示名称、邮箱、状态和系统角色；超级管理员账号受保护。
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedUserUpdate"
      responses:
        "200":
          description: 用户更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/users/{user_id}/reset-password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Auth]
      summary: 重置组织用户密码
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
      responses:
        "204":
          description: 密码重置成功
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/roles/options:
    get:
      tags: [Auth]
      summary: 查询可分配系统角色
      description: 仅返回超级管理员、项目管理员、实验员三类有效角色。
      responses:
        "200":
          description: 角色选项
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleOption"
  /dashboard:
    get:
      tags: [Dashboard]
      summary: 获取实时工作台
      parameters:
        - name: project_id
          in: query
          description: 仅统计指定项目的近 30 天实验趋势；空值表示全部项目。
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 项目、实验、类型分布、趋势和进行中项目
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
  /projects:
    get:
      tags: [Projects]
      summary: 分页查询可见项目
      description: 可见范围为本人组织及下级组织项目，并合并本人作为成员的跨组织项目。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            oneOf:
              - $ref: "#/components/schemas/ProjectStatus"
              - type: string
                enum: [running, not_started, ended]
        - name: project_type
          in: query
          schema:
            $ref: "#/components/schemas/ProjectType"
        - name: owner_id
          in: query
          schema:
            type: string
            format: uuid
        - name: ordering
          in: query
          schema:
            type: string
            enum:
              - updated_at
              - -updated_at
              - project_no
              - -project_no
              - planned_end_date
              - -planned_end_date
            default: -updated_at
      responses:
        "200":
          description: 项目分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
    post:
      tags: [Projects]
      summary: 创建项目
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          $ref: "#/components/responses/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{project_key}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Projects]
      summary: 获取项目详情
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Projects]
      summary: 更新项目、成员或里程碑
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /projects/{project_key}/follow:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [Projects]
      summary: 关注项目
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "200":
          $ref: "#/components/responses/FollowState"
    delete:
      tags: [Projects]
      summary: 取消关注项目
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "200":
          $ref: "#/components/responses/FollowState"
  /projects/{project_key}/archive:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/IfMatch"
    post:
      tags: [Projects]
      summary: 归档项目
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /projects/{project_key}/operation-logs:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Projects]
      summary: 查询项目最近操作记录
      responses:
        "200":
          description: 最近 100 条项目域操作记录
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationLog"
  /projects/{project_key}/documents:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Documents]
      summary: 查询项目文档
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/DocumentCategory"
        - name: file_type
          in: query
          schema:
            type: string
            enum: [word, pdf, excel, powerpoint, image, text]
        - name: updated_range
          in: query
          schema:
            type: string
            enum: [week, month]
      responses:
        "200":
          description: 文档列表和分类统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
    post:
      tags: [Documents]
      summary: 上传项目文档
      description: |
        单文件最大 100 MB，服务端校验扩展名、真实内容签名和办公压缩包安全边界。
        支持 DOC/DOCX/ODT/RTF、PDF、XLS/XLSX/ODS/CSV、PPT/PPTX/ODP、
        TXT、PNG/JPG/JPEG/WebP/GIF/BMP。
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, category, related_content, version_label]
              properties:
                file:
                  type: string
                  format: binary
                category:
                  $ref: "#/components/schemas/DocumentCategory"
                related_content:
                  type: string
                  maxLength: 200
                version_label:
                  type: string
                  pattern: "^[A-Za-z0-9._-]{1,32}$"
      responses:
        "201":
          description: 文档上传成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{project_key}/documents/{document_id}/content:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      summary: 读取或下载原始文档
      parameters:
        - name: download
          in: query
          schema:
            type: string
            enum: ["0", "1"]
      responses:
        "200":
          description: 真实原文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{project_key}/documents/{document_id}/preview:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      summary: 在线预览真实文档
      description: |
        该接口是组件失败和旧版格式的服务端兜底。PDF/图片返回原件；
        DOC/DOCX/ODT/RTF、XLS/XLSX/ODS/CSV、PPT/PPTX/ODP、TXT
        通过 LibreOffice 转换为缓存 PDF。前端优先从 content 接口读取
        DOCX、XLS/XLSX、PPTX、PDF 原件并使用专用组件渲染。
      responses:
        "200":
          description: 原始图片、PDF 或转换后的 PDF
          headers:
            X-Frame-Options:
              schema:
                type: string
                const: SAMEORIGIN
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/bmp:
              schema:
                type: string
                format: binary
        "406":
          description: 文件无法转换或服务器未配置转换程序
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /experiments:
    get:
      tags: [Experiments]
      summary: 分页查询可见实验
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ExperimentStatus"
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 实验分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentListResponse"
    post:
      tags: [Experiments]
      summary: 创建实验及默认 ELN
      description: 实验目的必填；未提供配方结构时默认创建 4 列、2 行。
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentCreate"
      responses:
        "201":
          $ref: "#/components/responses/Experiment"
        "400":
          $ref: "#/components/responses/ValidationError"
  /experiments/{experiment_key}:
    parameters:
      - $ref: "#/components/parameters/ExperimentKey"
    get:
      tags: [Experiments]
      summary: 获取实验与 ELN 详情
      responses:
        "200":
          $ref: "#/components/responses/Experiment"
    patch:
      tags: [Experiments]
      summary: 更新实验或 ELN
      description: 已完成实验仍可进行带版本校验和操作记录的修订。
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Experiment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /experiments/{experiment_key}/copy:
    parameters:
      - $ref: "#/components/parameters/ExperimentKey"
    post:
      tags: [Experiments]
      summary: 复制实验计划与 ELN 结构
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "201":
          $ref: "#/components/responses/Experiment"
  /experiments/{experiment_key}/transition:
    parameters:
      - $ref: "#/components/parameters/ExperimentKey"
      - $ref: "#/components/parameters/IfMatch"
    post:
      tags: [Experiments]
      summary: 开始或完成实验
      description: 只允许未开始→进行中→已完成；完成前必须填写实验结果。
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_status]
              properties:
                target_status:
                  type: string
                  enum: [in_progress, completed]
      responses:
        "200":
          $ref: "#/components/responses/Experiment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /experiments/{experiment_key}/attachments:
    parameters:
      - $ref: "#/components/parameters/ExperimentKey"
    post:
      tags: [Experiments]
      summary: 上传 ELN 真实附件
      description: 过程图片最多 20 张、单张 10 MB 且限真实 JPG/PNG；结果附件最多 30 个、单个 25 MB。
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  type: string
                  enum: [process_image, result_file]
                file:
                  type: string
                  format: binary
      responses:
        "201":
          $ref: "#/components/responses/Experiment"
        "400":
          $ref: "#/components/responses/ValidationError"
  /experiments/{experiment_key}/attachments/{attachment_id}:
    parameters:
      - $ref: "#/components/parameters/ExperimentKey"
      - $ref: "#/components/parameters/AttachmentId"
    delete:
      tags: [Experiments]
      summary: 删除 ELN 附件和存储文件
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "200":
          $ref: "#/components/responses/Experiment"
        "404":
          $ref: "#/components/responses/NotFound"
  /experiments/{experiment_key}/attachments/{attachment_id}/content:
    parameters:
      - $ref: "#/components/parameters/ExperimentKey"
      - $ref: "#/components/parameters/AttachmentId"
    get:
      tags: [Experiments]
      summary: 读取或下载 ELN 附件
      parameters:
        - name: download
          in: query
          schema:
            type: string
            enum: ["0", "1"]
      responses:
        "200":
          description: 真实附件文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前资源版本，例如 `"3"`。
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    ProjectKey:
      name: project_key
      in: path
      required: true
      description: 项目 UUID 或项目编号。
      schema:
        type: string
    ExperimentKey:
      name: experiment_key
      in: path
      required: true
      description: 实验 UUID 或实验编号。
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Session:
      description: 当前会话
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/SessionUser"
    Project:
      description: 项目对象
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectResponse"
    Experiment:
      description: 实验及 ELN
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExperimentResponse"
    FollowState:
      description: 关注状态
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [is_followed]
                properties:
                  is_followed:
                    type: boolean
    Unauthorized:
      description: 未登录或会话失效
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: 无操作权限
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 对象不存在或不在可见范围
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: 请求字段校验失败
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: 业务状态或保护规则冲突
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: 乐观锁版本冲突
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: 依赖未就绪
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, error]
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PageMeta:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    UserStatus:
      type: string
      enum: [active, locked, disabled]
    AssignableRoleCode:
      type: string
      enum: [system_admin, project_manager, researcher]
    SessionUser:
      type: object
      required:
        - id
        - organization_id
        - username
        - display_name
        - is_super_admin
        - permissions
        - role_codes
        - role_names
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        is_super_admin:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        role_codes:
          type: array
          items:
            $ref: "#/components/schemas/AssignableRoleCode"
        role_names:
          type: array
          items:
            type: string
            enum: [超级管理员, 项目管理员, 实验员]
    UserOption:
      type: object
      required: [id, organization_id, organization_name, username, display_name]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        username:
          type: string
        display_name:
          type: string
    UserOptionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserOption"
    RoleOption:
      type: object
      required: [role_code, name, description]
      properties:
        role_code:
          $ref: "#/components/schemas/AssignableRoleCode"
        name:
          type: string
        description:
          type: string
    ManagedUser:
      type: object
      required:
        - id
        - username
        - display_name
        - status
        - is_active
        - is_super_admin
        - role_codes
        - role_names
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/UserStatus"
        is_active:
          type: boolean
        is_super_admin:
          type: boolean
        role_codes:
          type: array
          items:
            $ref: "#/components/schemas/AssignableRoleCode"
        role_names:
          type: array
          items:
            type: string
        last_login:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ManagedUserCreate:
      type: object
      required: [username, display_name, password, role_codes]
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{3,64}$"
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        role_codes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AssignableRoleCode"
    ManagedUserUpdate:
      type: object
      minProperties: 1
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{3,64}$"
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/UserStatus"
        role_codes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AssignableRoleCode"
    ManagedUserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ManagedUser"
    ManagedUserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ManagedUser"
        meta:
          $ref: "#/components/schemas/PageMeta"
    ProjectStatus:
      type: string
      enum: [draft, not_started, active, at_risk, suspended, completed, archived]
    ProjectType:
      type: string
      enum: [聚酰亚胺, 环氧树脂]
    ProjectMilestone:
      type: object
