openapi: 3.1.0
info:
  title: 材料实验管理系统 API
  version: 0.1.0
  description: |
    项目 MVP 的机器可读接口基线。业务语义、分页、错误和并发规则见
    docs/07-api-and-integration-specification.md。
servers:
  - url: /api/v1
    description: 当前环境
tags:
  - name: Health
    description: 健康检查
  - name: Auth
    description: 会话认证
  - name: Identity
    description: 超级管理员用户与角色管理
  - name: Projects
    description: 项目管理
  - name: Experiments
    description: 实验管理
  - name: ELN
    description: 电子实验记录
  - name: Files
    description: 文件上传与下载
  - name: Testing
    description: 检测委托与结果
  - name: Reports
    description: 报告生成
  - name: Notifications
    description: 站内通知
security:
  - cookieAuth: []
paths:
  /health/live:
    get:
      tags: [Health]
      summary: 检查进程存活
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: 进程可响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      tags: [Health]
      summary: 检查服务就绪
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: 服务已就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/session:
    get:
      tags: [Auth]
      summary: 获取当前会话
      operationId: getSession
      responses:
        "200":
          description: 当前登录会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/csrf:
    get:
      tags: [Auth]
      summary: 获取登录所需 CSRF 令牌
      operationId: getCsrfToken
      security: []
      responses:
        "200":
          description: 返回 CSRF 令牌并设置 CSRF Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      operationId: login
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功并设置 Session Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前会话
      operationId: logout
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: 注销成功
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/users/options:
    get:
      tags: [Auth]
      summary: 查询当前组织可选项目人员
      operationId: listOrganizationUserOptions
      responses:
        "200":
          description: 当前组织有效用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUserOptionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/users:
    get:
      tags: [Identity]
      summary: 超级管理员分页查询当前组织用户
      operationId: listManagedUsers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ManagedUserStatus"
        - name: role_code
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 当前组织用户分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUserListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Identity]
      summary: 超级管理员创建组织用户
      operationId: createManagedUser
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedUserCreateRequest"
      responses:
        "201":
          description: 用户创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    get:
      tags: [Identity]
      summary: 超级管理员查询组织用户详情
      operationId: getManagedUser
      responses:
        "200":
          description: 组织用户详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Identity]
      summary: 超级管理员更新普通用户
      operationId: updateManagedUser
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedUserUpdateRequest"
      responses:
        "200":
          description: 用户更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/users/{user_id}/reset-password:
    post:
      tags: [Identity]
      summary: 超级管理员重置普通用户密码
      operationId: resetManagedUserPassword
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedUserPasswordResetRequest"
      responses:
        "204":
          description: 密码重置成功
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/roles/options:
    get:
      tags: [Identity]
      summary: 超级管理员查询可分配系统角色
      operationId: listManagedRoleOptions
      responses:
        "200":
          description: 可分配角色列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedRoleOptionListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects:
    get:
      tags: [Projects]
      summary: 查询可见项目
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: owner_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: ordering
          in: query
          schema:
            type: string
            enum: [updated_at, -updated_at, project_no, -project_no, planned_end_date, -planned_end_date]
            default: -updated_at
      responses:
        "200":
          description: 项目分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      summary: 创建项目
      operationId: createProject
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: 项目创建成功
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: 获取项目详情
      operationId: getProject
      responses:
        "200":
          description: 项目详情
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Projects]
      summary: 更新项目
      operationId: updateProject
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: 更新后的项目
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{project_id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: 查询项目成员
      operationId: listProjectMembers
      responses:
        "200":
          description: 项目成员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Projects]
      summary: 添加项目成员
      operationId: addProjectMember
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberCreate"
      responses:
        "201":
          description: 成员添加成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /experiments:
    get:
      tags: [Experiments]
      summary: 查询可见实验
      operationId: listExperiments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: project_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ExperimentStatus"
        - name: owner_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: ordering
          in: query
          schema:
            type: string
            enum: [updated_at, -updated_at, experiment_no, -experiment_no, planned_start_at, -planned_start_at]
            default: -updated_at
      responses:
        "200":
          description: 实验分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Experiments]
      summary: 创建实验草稿
      operationId: createExperiment
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentCreate"
      responses:
        "201":
          description: 实验创建成功
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /experiments/{experiment_id}:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    get:
      tags: [Experiments]
      summary: 获取实验详情
      operationId: getExperiment
      responses:
        "200":
          description: 实验详情
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Experiments]
      summary: 更新实验计划
      operationId: updateExperiment
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentUpdate"
      responses:
        "200":
          description: 更新后的实验
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
  /experiments/{experiment_id}/submit:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    post:
      tags: [Experiments]
      summary: 提交实验计划
      operationId: submitExperiment
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: 提交后的实验
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
  /eln-records/{record_id}:
    parameters:
      - $ref: "#/components/parameters/ElnRecordId"
    get:
      tags: [ELN]
      summary: 获取电子实验记录
      operationId: getElnRecord
      responses:
        "200":
          description: 电子实验记录
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElnRecordResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [ELN]
      summary: 保存电子实验记录草稿
      operationId: updateElnRecord
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElnRecordUpdate"
      responses:
        "200":
          description: 保存后的电子实验记录
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElnRecordResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
  /eln-records/{record_id}/steps/{step_id}:
    parameters:
      - $ref: "#/components/parameters/ElnRecordId"
      - $ref: "#/components/parameters/ElnStepId"
    put:
      tags: [ELN]
      summary: 保存单个实验步骤记录
      operationId: updateElnStepRecord
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElnStepRecordUpdate"
      responses:
        "200":
          description: 保存后的步骤记录
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElnStepRecordResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
  /eln-records/{record_id}/submit:
    parameters:
      - $ref: "#/components/parameters/ElnRecordId"
    post:
      tags: [ELN]
      summary: 提交电子实验记录并生成快照
      operationId: submitElnRecord
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: 提交后的电子实验记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElnRecordResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
  /eln-records/{record_id}/archive:
    parameters:
      - $ref: "#/components/parameters/ElnRecordId"
    post:
      tags: [ELN]
      summary: 归档电子实验记录
      operationId: archiveElnRecord
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: 已归档电子实验记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElnRecordResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /files/uploads:
    post:
      tags: [Files]
      summary: 初始化文件上传
      operationId: initializeFileUpload
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadInitialize"
      responses:
        "201":
          description: 上传会话初始化成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadInitializeResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: 文件超过大小限制
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"
  /files/{file_id}/complete:
    parameters:
      - $ref: "#/components/parameters/FileId"
    post:
      tags: [Files]
      summary: 确认文件上传完成
      operationId: completeFileUpload
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadComplete"
      responses:
        "202":
          description: 文件已进入校验或扫描
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /test-orders:
    get:
      tags: [Testing]
      summary: 查询检测委托
      operationId: listTestOrders
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: experiment_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TestOrderStatus"
        - name: assignee_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: 检测委托分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestOrderListResponse"
    post:
      tags: [Testing]
      summary: 创建检测委托
      operationId: createTestOrder
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestOrderCreate"
      responses:
        "201":
          description: 检测委托创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestOrderResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /test-orders/{test_order_id}/items/{item_id}/result:
    parameters:
      - $ref: "#/components/parameters/TestOrderId"
      - $ref: "#/components/parameters/TestOrderItemId"
    put:
      tags: [Testing]
      summary: 录入检测项结果
      operationId: upsertTestResult
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestResultUpsert"
      responses:
        "200":
          description: 检测结果已更新
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResultResponse"
        "201":
          description: 检测结果已创建
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResultResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
  /reports:
    get:
      tags: [Reports]
      summary: 查询报告
      operationId: listReports
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReportStatus"
        - name: source_type
          in: query
          schema:
            type: string
            enum: [experiment, test_order, project]
        - name: source_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: 报告分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
    post:
      tags: [Reports]
      summary: 发起报告生成
      operationId: createReport
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreate"
      responses:
        "202":
          description: 报告任务已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /reports/{report_id}:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [Reports]
      summary: 查询报告状态
      operationId: getReport
      responses:
        "200":
          description: 报告详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /notifications/stream:
    get:
      tags: [Notifications]
      summary: 订阅轻量通知事件
      operationId: streamNotifications
      responses:
        "200":
          description: Server-Sent Events 事件流
          content:
            text/event-stream:
              schema:
                type: string
                examples:
                  - "event: report.ready\ndata: {\"report_id\":\"6f4640ca-9b70-4f6e-a0fe-c53b969ee89f\"}\n\n"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Django Session Cookie
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Django CSRF Token
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
      description: 当前资源版本，例如 `"7"`
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
      description: 更新已有结果时必须提供；首次创建可省略
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        oneOf:
          - $ref: "#/components/schemas/Uuid"
          - type: string
            pattern: "^PRJ-[A-Z0-9-]+$"
      description: 项目 UUID 或项目业务编号
    ExperimentId:
      name: experiment_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ElnRecordId:
      name: record_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ElnStepId:
      name: step_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    TestOrderId:
      name: test_order_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    TestOrderItemId:
      name: item_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  headers:
    ETag:
      description: 资源乐观锁版本
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  responses:
    Unauthorized:
      description: 未登录或会话失效
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: 无动作权限
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 对象不存在或不可见
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: 资源状态或唯一约束冲突
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: 资源版本冲突
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: 字段或业务规则校验失败
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: 请求频率超限
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: 服务依赖未就绪
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Uuid:
      type: string
      format: uuid
    DateTime:
      type: string
      format: date-time
    DecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
      examples: ["12.500000"]
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          additionalProperties:
            type: string
    PageMeta:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        request_id:
          $ref: "#/components/schemas/Uuid"
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
    SessionUser:
      type: object
      required: [id, organization_id, username, display_name, is_super_admin, permissions, role_codes, role_names]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        organization_id:
          $ref: "#/components/schemas/Uuid"
        username:
          type: string
        display_name:
          type: string
        is_super_admin:
          type: boolean
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
        role_codes:
          type: array
          uniqueItems: true
          items:
            type: string
        role_names:
          type: array
          uniqueItems: true
          items:
            type: string
    ManagedUserStatus:
      type: string
      enum: [active, locked, disabled]
    ManagedUser:
      type: object
      required:
        - id
        - username
        - display_name
        - email
        - status
        - is_active
        - is_super_admin
        - role_codes
        - role_names
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/ManagedUserStatus"
        is_active:
          type: boolean
        is_super_admin:
          type: boolean
        role_codes:
          type: array
          uniqueItems: true
          items:
            type: string
        role_names:
          type: array
          uniqueItems: true
          items:
            type: string
        last_login:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ManagedUserCreateRequest:
      type: object
      required: [username, display_name, password, status, role_codes]
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{3,64}$"
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        status:
          $ref: "#/components/schemas/ManagedUserStatus"
        role_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
    ManagedUserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{3,64}$"
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/ManagedUserStatus"
        role_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
    ManagedUserPasswordResetRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
    ManagedUserResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/ManagedUser"
        request_id:
          $ref: "#/components/schemas/Uuid"
    ManagedUserListResponse:
      type: object
      required: [data, meta, request_id]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ManagedUser"
        meta:
          $ref: "#/components/schemas/PageMeta"
        request_id:
          $ref: "#/components/schemas/Uuid"
    ManagedRoleOption:
      type: object
      required: [role_code, name, description]
      properties:
        role_code:
          type: string
        name:
          type: string
        description:
          type: string
    ManagedRoleOptionListResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ManagedRoleOption"
        request_id:
          $ref: "#/components/schemas/Uuid"
    SessionResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/SessionUser"
        request_id:
          $ref: "#/components/schemas/Uuid"
    CsrfResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [csrf_token]
          properties:
            csrf_token:
              type: string
              minLength: 32
        request_id:
          $ref: "#/components/schemas/Uuid"
    ProjectStatus:
      type: string
      enum: [draft, not_started, active, at_risk, suspended, completed, archived]
    Project:
      type: object
      required:
        - id
        - project_no
        - name
        - project_type_code
        - current_stage
        - progress_percent
        - document_count
        - experiment_count
        - data_resource_count
        - objectives
        - milestones
        - status
        - owner_id
        - owner_display_name
        - members
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        project_no:
          type: string
        name:
          type: string
        project_type_code:
          type: string
        description:
          type: string
        current_stage:
          type: string
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        document_count:
          type: integer
          minimum: 0
        experiment_count:
          type: integer
          minimum: 0
        data_resource_count:
          type: integer
          minimum: 0
        objectives:
          type: array
          items:
            type: string
        milestones:
          type: array
          items:
            type: object
            required: [date, name, state]
            properties:
              date:
                type: string
                format: date
              name:
                type: string
              state:
                type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        owner_id:
          $ref: "#/components/schemas/Uuid"
        owner_display_name:
          type: string
        members:
          type: array
          items:
            type: object
            required: [user_id, display_name, member_role]
            properties:
              user_id:
                $ref: "#/components/schemas/Uuid"
              display_name:
                type: string
              member_role:
                $ref: "#/components/schemas/ProjectMemberRole"
        planned_start_date:
          type: [string, "null"]
          format: date
        planned_end_date:
          type: [string, "null"]
          format: date
        actual_end_at:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        archived_at:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        version:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name, project_type_code, owner_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        project_type_code:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 10000
        current_stage:
          type: string
          maxLength: 64
        objectives:
          type: array
          items:
            type: string
            maxLength: 1000
        milestones:
          type: array
          items:
            type: object
        owner_id:
          $ref: "#/components/schemas/Uuid"
        member_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
        planned_start_date:
          type: string
          format: date
        planned_end_date:
          type: string
          format: date
    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        project_type_code:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: [string, "null"]
          maxLength: 10000
        current_stage:
          type: string
          maxLength: 64
        objectives:
          type: array
          items:
            type: string
            maxLength: 1000
        milestones:
          type: array
          items:
            type: object
        owner_id:
          $ref: "#/components/schemas/Uuid"
        member_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
        planned_start_date:
          type: [string, "null"]
          format: date
        planned_end_date:
          type: [string, "null"]
          format: date
    ProjectResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/Project"
        request_id:
          $ref: "#/components/schemas/Uuid"
    ProjectListResponse:
