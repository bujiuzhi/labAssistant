          type: "string"
        status:
          type: "string"
          enum: ["not_started","in_progress","completed"]
        purpose:
          type: "string"
        estimated_start:
          type: "string"
          format: "date-time"
        estimated_end:
          type: "string"
          format: "date-time"
        started_at:
          type: "string"
          format: "date-time"
        completed_at:
          type: "string"
          format: "date-time"
        owner_id:
          type: "string"
          format: "uuid"
        owner_display_name:
          type: "string"
        participant_ids:
          type: "array"
          items:
            type: "string"
            format: "uuid"
          readOnly: true
        participant_names:
          type: "array"
          items:
            type: "string"
          readOnly: true
        record:
          "$ref": "#/components/schemas/ExperimentRecord"
        can_edit:
          type: "boolean"
          description: "服务端按状态、权限和用户范围计算；completed 始终为 false"
          readOnly: true
        version:
          type: "integer"
          minimum: 1
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
      description: "未赋值的可空日期时间字段按当前配置省略。"
    DashboardMetrics:
      type: "object"
      required: ["total","active","archived","at_risk","in_progress","completed"]
      properties:
        total:
          type: "integer"
          format: "int64"
        active:
          type: "integer"
          format: "int64"
        archived:
          type: "integer"
          format: "int64"
        at_risk:
          type: "integer"
          format: "int64"
        in_progress:
          type: "integer"
          format: "int64"
        completed:
          type: "integer"
          format: "int64"
      description: "项目指标的 in_progress/completed、实验指标的 active/archived/at_risk 固定为 0。"
    DashboardProject:
      type: "object"
      required: ["id","project_no","name","project_type","owner_name","objectives","progress_percent","is_followed","risk_level"]
      properties:
        id:
          type: "string"
          format: "uuid"
        project_no:
          type: "string"
        name:
          type: "string"
        project_type:
          type: "string"
        owner_name:
          type: "string"
        objectives:
          type: "array"
          items:
            type: "string"
        planned_start_date:
          type: ["string","null"]
          format: "date-time"
        planned_end_date:
          type: ["string","null"]
          format: "date-time"
        milestone:
          anyOf:
            -
              "$ref": "#/components/schemas/ProjectMilestone"
            -
              type: "null"
        progress_percent:
          type: "integer"
        is_followed:
          type: "boolean"
        risk_level:
          type: "string"
          enum: ["normal","countdown","overdue"]
        risk_days:
          type: ["integer","null"]
          description: "按 Asia/Shanghai 当前日期到里程碑日期的天数；无有效日期时无值"
    Dashboard:
      type: "object"
      required: ["project_metrics","experiment_metrics","type_distribution","trend","active_projects"]
      properties:
        project_metrics:
          "$ref": "#/components/schemas/DashboardMetrics"
        experiment_metrics:
          "$ref": "#/components/schemas/DashboardMetrics"
        type_distribution:
          type: "array"
          items:
            type: "object"
            required: ["name","project_count","experiment_count"]
            properties:
              name:
                type: "string"
              project_count:
                type: "integer"
                format: "int64"
              experiment_count:
                type: "integer"
                format: "int64"
        trend:
          type: "object"
          required: ["dates","series","selected_project_id","project_options"]
          properties:
            dates:
              type: "array"
              items:
                type: "string"
                format: "date"
              minItems: 30
              maxItems: 30
            series:
              type: "array"
              items:
                type: "object"
                required: ["name","values"]
                properties:
                  name:
                    type: "string"
                  values:
                    type: "array"
                    items:
                      type: "integer"
                      format: "int64"
                    minItems: 30
                    maxItems: 30
            selected_project_id:
              type: "string"
              description: "project_id 查询参数回显；未提供时为空串，当前不改变统计数据"
            project_options:
              type: "array"
              items:
                type: "object"
                required: ["id","project_no","name"]
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                  project_no:
                    type: "string"
                  name:
                    type: "string"
        active_projects:
          type: "array"
          items:
            "$ref": "#/components/schemas/DashboardProject"
