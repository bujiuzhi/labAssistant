      type: object
      required: [data, category_counts]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDocument"
        category_counts:
          type: object
          additionalProperties:
            type: integer
    DashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required:
            - project_metrics
            - experiment_metrics
            - type_distribution
            - trend
            - active_projects
          properties:
            project_metrics:
              type: object
              required: [total, active, archived, at_risk]
              properties:
                total:
                  type: integer
                active:
                  type: integer
                archived:
                  type: integer
                at_risk:
                  type: integer
            experiment_metrics:
              type: object
              required: [total, in_progress, completed]
              properties:
                total:
                  type: integer
                in_progress:
                  type: integer
                completed:
                  type: integer
            type_distribution:
              type: array
              items:
                type: object
                required: [name, project_count, experiment_count]
                properties:
                  name:
                    $ref: "#/components/schemas/ProjectType"
                  project_count:
                    type: integer
                  experiment_count:
                    type: integer
            trend:
              type: object
              required: [dates, series, selected_project_id, project_options]
              properties:
                dates:
                  type: array
                  items:
                    type: string
                    format: date
                series:
                  type: array
                  items:
                    type: object
                    required: [name, values]
                    properties:
                      name:
                        type: string
                      values:
                        type: array
                        items:
                          type: integer
                selected_project_id:
                  type: string
                project_options:
                  type: array
                  items:
                    type: object
                    required: [id, project_no, name]
                    properties:
                      id:
                        type: string
                        format: uuid
                      project_no:
                        type: string
                      name:
                        type: string
            active_projects:
              type: array
              items:
                type: object
                additionalProperties: true
