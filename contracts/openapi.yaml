          $ref: "#/components/schemas/Uuid"
        source_template_step_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sequence_no:
          type: integer
          minimum: 1
        title:
          type: string
        instructions:
          type: [string, "null"]
        planned_parameters:
          type: object
          additionalProperties: true
        schema_version:
          type: integer
          minimum: 1
        planned_duration_minutes:
          type: [integer, "null"]
          minimum: 0
        is_required:
          type: boolean
    ExperimentStepInput:
      type: object
      additionalProperties: false
      required: [sequence_no, title]
      properties:
        source_template_step_id:
          $ref: "#/components/schemas/Uuid"
        sequence_no:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        instructions:
          type: string
          maxLength: 10000
        planned_parameters:
          type: object
          additionalProperties: true
          default: {}
        schema_version:
          type: integer
          minimum: 1
          default: 1
        planned_duration_minutes:
          type: integer
          minimum: 0
        is_required:
          type: boolean
          default: true
    ExperimentParticipantInput:
      type: object
      additionalProperties: false
      required: [user_id, participant_role]
      properties:
        user_id:
          $ref: "#/components/schemas/Uuid"
        participant_role:
          type: string
          enum: [executor, collaborator, viewer]
    ExperimentParticipant:
      type: object
      required: [id, user_id, participant_role]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        user_id:
          $ref: "#/components/schemas/Uuid"
        participant_role:
          type: string
          enum: [executor, collaborator, viewer]
    ExperimentMaterialInput:
      type: object
      additionalProperties: false
      required: [material_id, unit_id]
      properties:
        material_id:
          $ref: "#/components/schemas/Uuid"
        material_batch_id:
          $ref: "#/components/schemas/Uuid"
        purpose:
          type: string
          maxLength: 200
        planned_quantity:
          $ref: "#/components/schemas/DecimalString"
        unit_id:
          $ref: "#/components/schemas/Uuid"
        sort_order:
          type: integer
          minimum: 0
          default: 0
    Experiment:
      type: object
      required:
        - id
        - experiment_no
        - project_id
        - title
        - experiment_type_code
        - objective
        - owner_id
        - status
        - requires_testing
        - participants
        - steps
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        experiment_no:
          type: string
        project_id:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        experiment_type_code:
          type: string
        objective:
          type: string
        owner_id:
          $ref: "#/components/schemas/Uuid"
        template_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        eln_record_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        status:
          $ref: "#/components/schemas/ExperimentStatus"
        planned_start_at:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        planned_end_at:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        actual_start_at:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        actual_end_at:
          oneOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        requires_testing:
          type: boolean
        conclusion_summary:
          type: [string, "null"]
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentParticipant"
