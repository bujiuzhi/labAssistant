# 维护依据：当前后端 Controller、Service、domain 与 SecurityConfig；这是 API 文档，不代表运行验收。
openapi: "3.1.0"
info:
  title: "材料实验助手 API"
  version: "1.0.0"
  description: |-
    当前后端实现的接口清单；维护依据为 backend 中的 Controller、Service、响应模型和安全配置。
    普通成功响应使用 data 和 request_id；分页另有 meta。空 data 按当前 NON_NULL 配置省略。
    204 和文件正文不使用成功信封。错误返回 application/json，包含业务 Problem Details 兼容对象、精简安全错误或内部错误；不能假定所有错误都有 detail、instance 或 request_id。

    前端使用同源 Session（默认 Cookie 为 JSESSIONID）。先获取 /auth/csrf 并保留 csrftoken，写请求携带匹配的 X-CSRFToken；登录也受 CSRF 校验。当前 SecurityConfig 另启用了 HTTP Basic。
    项目和实验读取按当前组织限定数据范围，普通用户另受项目、负责人或实验参与关系约束。创建实验或变更实验关联项目时先校验项目属于当前组织；超级管理员仅跳过项目管理成员检查。平台管理员仅能开通与查看组织目录，不获得其他组织的业务数据读取权。项目和实验受版本保护的操作使用 ETag / If-Match；当前没有 Idempotency-Key 去重实现。

    时间字段沿用现有 API 的 ISO 8601 表示，带时间的响应为含偏移量的日期时间。规范要求客户端展示及人工记录统一到 Asia/Shanghai，但当前页面部分格式化使用浏览器默认时区，尚未统一。项目和实验计划时间省略偏移量时服务端按 Asia/Shanghai 解释；调用方仍应优先提交含偏移量的日期时间。

    能力边界：ready 检查应用启动就绪及数据库连接；项目文档和实验附件正文保存在 PostgreSQL，文档 preview 返回原件。RustFS 存储和 LibreOffice 服务端转换尚未接入。
    实验参与人可随创建或 PATCH 写入；项目成员仅可读取，创建时加入创建者。开发初始化不能替代生产组织、角色和管理员引导；本契约不表示已完成生产部署验收。
servers:
  -
    url: "/api/v1"
    description: "同源 API"
tags:
  -
    name: "Health"
    description: "进程和数据库健康检查"
  -
    name: "Auth"
    description: "会话、用户与角色选项"
  -
    name: "Organizations"
    description: "当前组织范围与平台组织开通"
  -
    name: "Dashboard"
    description: "当前可见数据统计"
  -
    name: "Projects"
    description: "项目、关注和操作日志"
  -
    name: "Documents"
    description: "项目文档元数据和原始正文"
  -
    name: "Experiments"
    description: "实验计划、电子实验记录和状态迁移"
security:
  -
    cookieAuth: []
  -
    basicAuth: []
paths:
  "/health/live":
    get:
      operationId: "getLiveness"
      tags: ["Health"]
      summary: "检查 API 进程存活"
      security: []
      responses:
        "200":
          description: "进程可响应，不检查外部依赖"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HealthResponse"
  "/health/ready":
    get:
      operationId: "getReadiness"
      tags: ["Health"]
      summary: "检查应用启动状态及数据库连接"
      description: "全部启动任务完成且应用接受流量后，获取 JDBC 连接并执行 isValid(2)；不检查 Redis、RustFS、文档转换或业务完整性。"
      security: []
      responses:
        "200":
          description: "data.status 为 ok，data.database 为 ready"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HealthResponse"
        "503":
          description: "应用未就绪时 data.status 为 error、data.application 为 not_ready；数据库故障时 data.status 为 error、data.database 为 unavailable。"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HealthResponse"
  "/auth/csrf":
    get:
      operationId: "getCsrfToken"
      tags: ["Auth"]
      summary: "获取 CSRF 令牌"
      security: []
      responses:
        "200":
          description: "返回令牌并设置或复用 csrftoken Cookie"
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/Envelope"
                  -
                    type: "object"
                    required: ["data"]
                    properties:
                      data:
                        type: "object"
                        required: ["csrf_token"]
                        properties:
                          csrf_token:
                            type: "string"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/login":
    post:
      operationId: "login"
      tags: ["Auth"]
      summary: "登录并建立服务器会话"
      description: "登录也受 CSRF 校验；username 和 password 必须非空白字符串。"
      security:
        -
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["username","password"]
              properties:
                username:
                  type: "string"
                  minLength: 1
                password:
                  type: "string"
                  minLength: 1
                  format: "password"
                  writeOnly: true
      responses:
        "200":
          "$ref": "#/components/responses/Session"
        "401":
          "$ref": "#/components/responses/ApiError"
        "403":
          "$ref": "#/components/responses/ApiError"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/register":
    post:
      operationId: "registerByInvitation"
      tags: ["Auth"]
      summary: "使用一次性邀请码注册普通用户"
      description: "无需登录但必须携带 CSRF。邀请码决定组织和角色，明文邀请码不被持久化；注册不自动登录，不能创建超级管理员。"
      security:
        -
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/InvitationRegistration"
      responses:
        "201":
          "$ref": "#/components/responses/EmptySuccess"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/logout":
    post:
      operationId: "logout"
      tags: ["Auth"]
      summary: "失效当前服务器会话"
      description: "按同源 Session 流程调用，要求已有服务器会话。"
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
      responses:
        "204":
          description: "注销成功，无响应正文"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/password":
    post:
      operationId: "changeOwnPassword"
      tags: ["Auth"]
      summary: "修改当前登录用户密码"
      description: "校验当前密码与统一密码策略（至少 6 个字符，包含英文字母和数字，不含空白或控制字符且不得与用户名相同）；成功后立即失效当前 Servlet Session，调用方需重新登录。"
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OwnPasswordChange"
      responses:
        "204":
          description: "密码已修改，当前会话已失效"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/session":
    get:
      operationId: "getSession"
      tags: ["Auth"]
      summary: "获取当前认证用户"
      responses:
        "200":
          "$ref": "#/components/responses/Session"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/users/options":
    get:
      operationId: "listUserOptions"
      tags: ["Auth"]
      summary: "查询当前组织及下级组织的有效用户选项"
      description: "要求 project.create 权限；递归包含当前组织及下级组织的 active 用户，仅返回 id、username 和 display_name。注意项目和实验负责人写入仍要求用户属于当前组织，因此下级组织选项不一定可用于保存。"
      responses:
        "200":
          description: "有效用户选项"
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/Envelope"
                  -
                    type: "object"
                    required: ["data"]
                    properties:
                      data:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/UserOption"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/roles/options":
    get:
      operationId: "listRoleOptions"
      tags: ["Auth"]
      summary: "查询当前组织可分配角色"
      description: "仅超级管理员可访问；角色代码以本接口返回值为准。"
      responses:
        "200":
          description: "角色选项"
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/Envelope"
                  -
                    type: "object"
                    required: ["data"]
                    properties:
                      data:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/RoleOption"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/invitations":
    get:
      operationId: "listRegistrationInvitations"
      tags: ["Auth"]
      summary: "查询当前组织的邀请码元数据"
      description: "仅超级管理员。邀请码明文仅在创建响应中返回一次，列表不包含明文或哈希。"
      responses:
        "200":
          description: "最近 100 条邀请码元数据"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Envelope"
                  - type: "object"
                    properties:
                      data:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/RegistrationInvitation"
        default:
          "$ref": "#/components/responses/ApiError"
    post:
      operationId: "createRegistrationInvitation"
      tags: ["Auth"]
      summary: "签发绑定角色的一次性邀请码"
      description: "仅超级管理员。角色不能是 super_admin；邀请码有效期为 1 至 720 小时，明文只随本次响应返回。"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegistrationInvitationCreate"
      responses:
        "201":
          description: "邀请码签发成功"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Envelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/RegistrationInvitationIssue"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/invitations/{invitationId}/revoke":
    post:
      operationId: "revokeRegistrationInvitation"
      tags: ["Auth"]
      summary: "撤销尚未使用的邀请码"
      description: "仅超级管理员；邀请码已使用、已撤销或不存在时返回 404。"
      parameters:
        -
          name: "invitationId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "204":
          description: "邀请码已撤销"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/users":
    get:
      operationId: "listUsers"
      tags: ["Auth"]
      summary: "分页查询当前组织用户"
      description: "仅超级管理员可访问。"
      parameters:
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/PageSize"
        -
          "$ref": "#/components/parameters/Search"
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
          description: "用户状态筛选，例如 active、locked、disabled"
        -
          name: "role_code"
          in: "query"
          schema:
            type: "string"
          description: "角色选项接口返回的角色代码"
      responses:
        "200":
          description: "用户分页列表"
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/PageEnvelope"
                  -
                    type: "object"
                    required: ["data"]
                    properties:
                      data:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/ManagedUser"
        default:
          "$ref": "#/components/responses/ApiError"
    post:
      operationId: "createUser"
      tags: ["Auth"]
      summary: "创建当前组织用户并绑定角色"
      description: "仅超级管理员。当前返回 HTTP 200 和 request_id，不返回新建用户实体。"
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UserCreate"
      responses:
        "200":
          "$ref": "#/components/responses/EmptySuccess"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/users/{userId}":
    parameters:
      -
        "$ref": "#/components/parameters/UserId"
    patch:
      operationId: "updateUser"
      tags: ["Auth"]
      summary: "更新当前组织普通用户"
      description: |-
        仅超级管理员，不能修改超级管理员账号。虽使用 PATCH，username、display_name、status、role_codes 均必须完整提交。
        email 省略时写入空串，角色关联按本次 role_codes 整体替换。返回 request_id，不返回用户实体。
        当前没有按用户 ID 读取详情的 GET 接口。
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UserWrite"
      responses:
        "200":
          "$ref": "#/components/responses/EmptySuccess"
        default:
          "$ref": "#/components/responses/ApiError"
  "/auth/users/{userId}/reset-password":
    parameters:
      -
        "$ref": "#/components/parameters/UserId"
    post:
      operationId: "resetUserPassword"
      tags: ["Auth"]
      summary: "重置当前组织普通用户密码"
      description: "仅超级管理员；超级管理员账号受保护；密码至少 6 个字符，包含英文字母和数字，不含空白或控制字符且不得与用户名相同。"
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["password"]
              properties:
                password:
                  type: "string"
                  minLength: 6
                  format: "password"
                  writeOnly: true
      responses:
        "204":
          description: "密码已更新，无响应正文"
        default:
          "$ref": "#/components/responses/ApiError"
  "/organizations/current":
    get:
      operationId: "getCurrentOrganization"
      tags: ["Organizations"]
      summary: "获取当前会话所属有效组织"
      description: "要求 organization.read 权限；组织不存在或停用时返回 404。"
      responses:
        "200":
          description: "当前组织"
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/Envelope"
                  -
                    type: "object"
                    required: ["data"]
                    properties:
                      data:
                        "$ref": "#/components/schemas/Organization"
        default:
          "$ref": "#/components/responses/ApiError"
  "/organizations":
    get:
      operationId: "listOrganizations"
      tags: ["Organizations"]
      summary: "查询平台组织目录"
      description: "仅 is_platform_admin=true 的平台管理员可调用；只返回组织基础元数据，不返回任何组织业务数据。"
      responses:
        "200":
          description: "组织目录"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Envelope"
                  - type: "object"
                    required: ["data"]
                    properties:
                      data:
                        type: "array"
                        items: { "$ref": "#/components/schemas/PlatformOrganization" }
        default:
          "$ref": "#/components/responses/ApiError"
    post:
      operationId: "createOrganization"
      tags: ["Organizations"]
      summary: "开通组织及其首个组织管理员"
      description: "仅平台管理员。一个事务内创建根组织、三个内置角色、角色权限及该组织首个超级管理员；不创建业务数据，新管理员不继承平台管理员权限。"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PlatformOrganizationCreate"
      responses:
        "201":
          description: "组织已开通；响应不含管理员密码"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Envelope"
                  - type: "object"
                    required: ["data"]
                    properties:
                      data: { "$ref": "#/components/schemas/PlatformOrganization" }
        default:
          "$ref": "#/components/responses/ApiError"
  "/dashboard":
    get:
      operationId: "getDashboard"
      tags: ["Dashboard"]
      summary: "获取当前可见项目和实验统计"
      description: |-
        要求 project.read 权限。趋势按 Asia/Shanghai 当前日期生成最近 30 个日期。
        当前 project_id 仅回显到 trend.selected_project_id，没有参与统计查询，不应依赖它筛选趋势。
      parameters:
        -
          name: "project_id"
          in: "query"
          schema:
            type: "string"
            format: "uuid"
          description: "当前仅回显的项目选择值"
      responses:
        "200":
          description: "工作台统计"
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/Envelope"
                  -
                    type: "object"
                    required: ["data"]
                    properties:
                      data:
                        "$ref": "#/components/schemas/Dashboard"
        default:
          "$ref": "#/components/responses/ApiError"
  "/projects":
    get:
      operationId: "listProjects"
      tags: ["Projects"]
      summary: "分页查询当前用户可见项目"
      description: "要求 project.read 权限；普通用户按项目负责人或成员身份限定数据范围。"
      parameters:
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/PageSize"
        -
          "$ref": "#/components/parameters/Search"
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
          description: "状态筛选；running 兼容映射为 active，ended 聚合 completed 和 archived，其余非空值按原值筛选"
      responses:
        "200":
          description: "项目分页列表"
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/PageEnvelope"
                  -
                    type: "object"
                    required: ["data"]
                    properties:
                      data:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/Project"
        default:
          "$ref": "#/components/responses/ApiError"
    post:
      operationId: "createProject"
      tags: ["Projects"]
      summary: "创建项目并加入创建者为管理成员"
      description: |-
        要求 project.create 和返回资源所需的 project.read 权限；负责人须为当前组织有效用户。
        当前不处理 members 或 member_ids，不实现 Idempotency-Key 去重；重试可能创建多个项目。
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              allOf:
                -
                  "$ref": "#/components/schemas/ProjectWrite"
                -
                  type: "object"
                  required: ["name"]
      responses:
        "201":
          "$ref": "#/components/responses/Project"
        default:
          "$ref": "#/components/responses/ApiError"
  "/projects/{projectKey}":
    parameters:
      -
        "$ref": "#/components/parameters/ProjectKey"
    get:
      operationId: "getProject"
      tags: ["Projects"]
      summary: "获取可见项目详情及版本"
      description: "要求 project.read 权限；项目不存在或不在可见范围时返回 404。"
      responses:
        "200":
          "$ref": "#/components/responses/Project"
        default:
          "$ref": "#/components/responses/ApiError"
    patch:
      operationId: "updateProject"
      tags: ["Projects"]
      summary: "按资源版本更新项目"
      description: |-
        要求 project.update、project.read 和项目管理范围。未提交字段保留原值；当前不处理成员写入。
        已归档项目不能继续更新，版本不匹配或已归档时返回 412。
        objectives 和 milestones 整体替换，显式 null 写为空数组。
        计划时间省略或显式 null 均保留原值，当前没有清空已有计划时间的语义。
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        -
          "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ProjectWrite"
      responses:
        "200":
          "$ref": "#/components/responses/Project"
        "412":
          "$ref": "#/components/responses/ApiError"
        "428":
          "$ref": "#/components/responses/ApiError"
        default:
          "$ref": "#/components/responses/ApiError"
  "/projects/{projectKey}/archive":
    parameters:
      -
        "$ref": "#/components/parameters/ProjectKey"
    post:
      operationId: "archiveProject"
      tags: ["Projects"]
      summary: "归档项目"
      description: "要求 project.archive、project.read 和项目管理范围；已归档或版本不匹配返回 412。"
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        -
          "$ref": "#/components/parameters/IfMatch"
      responses:
        "200":
          "$ref": "#/components/responses/Project"
        "412":
          "$ref": "#/components/responses/ApiError"
        "428":
          "$ref": "#/components/responses/ApiError"
        default:
          "$ref": "#/components/responses/ApiError"
  "/projects/{projectKey}/follow":
    parameters:
      -
        "$ref": "#/components/parameters/ProjectKey"
    post:
      operationId: "followProject"
      tags: ["Projects"]
      summary: "关注可见项目"
      description: "要求 project.read 权限及项目可见性。"
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      responses:
        "200":
          "$ref": "#/components/responses/Follow"
        default:
          "$ref": "#/components/responses/ApiError"
    delete:
      operationId: "unfollowProject"
      tags: ["Projects"]
      summary: "取消关注可见项目"
      description: "要求 project.read 权限及项目可见性。"
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      responses:
        "200":
          "$ref": "#/components/responses/Follow"
        default:
          "$ref": "#/components/responses/ApiError"
  "/projects/{projectKey}/operation-logs":
    parameters:
      -
        "$ref": "#/components/parameters/ProjectKey"
    get:
      operationId: "listProjectOperationLogs"
      tags: ["Projects"]
      summary: "读取项目已有操作日志"
      description: "要求 project.read 权限及项目可见性；返回数据库已有日志，不承诺所有写操作均产生日志。"
      responses:
        "200":
          description: "项目操作日志列表"
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/Envelope"
                  -
                    type: "object"
                    required: ["data"]
                    properties:
                      data:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/ProjectOperationLog"
        default:
          "$ref": "#/components/responses/ApiError"
  "/projects/{projectKey}/documents":
    parameters:
      -
        "$ref": "#/components/parameters/ProjectKey"
    get:
      operationId: "listProjectDocuments"
      tags: ["Documents"]
      summary: "查询项目文档和分类统计"
      description: "要求 document.view、project.read 及项目可见性；列表不分页，分类总数不受筛选影响。"
      parameters:
        -
          name: "category"
          in: "query"
          schema:
            "$ref": "#/components/schemas/DocumentCategory"
        -
          "$ref": "#/components/parameters/Search"
        -
          name: "file_type"
          in: "query"
          schema:
            type: "string"
            enum: ["word","pdf","excel","powerpoint","image","text"]
          description: "按文件名扩展名筛选，不依据 MIME 类型"
        -
          name: "updated_range"
          in: "query"
          schema:
            type: "string"
            enum: ["week","month"]
          description: "week 为最近 7 天，month 为最近 30 天"
      responses:
        "200":
          description: "文档列表、项目总数、筛选总数和分类计数"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DocumentListResponse"
        default:
          "$ref": "#/components/responses/ApiError"
    post:
      operationId: "uploadProjectDocument"
      tags: ["Documents"]
      summary: "上传文档元数据和原始正文"
      description: |-
        要求 document.upload、project.read 和项目管理范围。正文写入 PostgreSQL。
        服务层要求文件非空且不超过 20971520 字节；实际可上传大小还受服务器 multipart 与反向代理限制。
        当前没有内容格式鉴定、对象存储转存或服务端办公文档转换。
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              required: ["file","category","version_label"]
              properties:
                file:
                  type: "string"
                  format: "binary"
                  description: "非空原始文件"
                category:
                  "$ref": "#/components/schemas/DocumentCategory"
                version_label:
                  type: "string"
                  minLength: 1
                  description: "去除首尾空白后必须非空"
      responses:
        "201":
          description: "已保存的文档元数据"
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/Envelope"
                  -
                    type: "object"
                    required: ["data"]
                    properties:
                      data:
                        "$ref": "#/components/schemas/ProjectDocument"
        default:
          "$ref": "#/components/responses/ApiError"
  "/projects/{projectKey}/documents/{documentId}/content":
    parameters:
      -
        "$ref": "#/components/parameters/ProjectKey"
      -
        "$ref": "#/components/parameters/DocumentId"
    get:
      operationId: "getProjectDocumentContent"
      tags: ["Documents"]
      summary: "读取或下载项目文档原件"
      description: "要求 document.view、project.read 及项目可见性；文档或正文不存在返回 404。"
      parameters:
        -
          name: "download"
          in: "query"
          schema:
            type: "boolean"
            default: false
          description: "true 使用 attachment，false 使用 inline"
      responses:
        "200":
          "$ref": "#/components/responses/DocumentBinary"
        default:
          "$ref": "#/components/responses/ApiError"
  "/projects/{projectKey}/documents/{documentId}/preview":
    parameters:
      -
        "$ref": "#/components/parameters/ProjectKey"
      -
        "$ref": "#/components/parameters/DocumentId"
    get:
      operationId: "getProjectDocumentPreview"
      tags: ["Documents"]
      summary: "以内联方式读取文档原件"
      description: |-
        与 content 调用相同正文读取逻辑，Content-Disposition 固定为 inline。
        返回原始字节和保存的 MIME 类型（包括 image/webp 等），不会把办公文档转换为 PDF。
        浏览器或前端能否预览取决于实际文件格式及其预览组件。要求 document.view、project.read 及项目可见性。
      responses:
        "200":
          "$ref": "#/components/responses/DocumentBinary"
        default:
          "$ref": "#/components/responses/ApiError"
  "/experiments":
    get:
      operationId: "listExperiments"
      tags: ["Experiments"]
      summary: "分页查询可见实验及电子记录"
      description: "要求 experiment.read 权限；普通用户按所属项目的负责人或成员身份限定可见范围。"
      parameters:
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/PageSize"
        -
          "$ref": "#/components/parameters/Search"
        -
          name: "project_id"
          in: "query"
          schema:
            type: "string"
            format: "uuid"
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
          description: "按实验状态原值筛选"
      responses:
        "200":
          description: "含电子记录的实验分页列表"
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/PageEnvelope"
                  -
                    type: "object"
                    required: ["data"]
                    properties:
                      data:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/Experiment"
        default:
          "$ref": "#/components/responses/ApiError"
    post:
      operationId: "createExperiment"
      tags: ["Experiments"]
      summary: "创建实验和电子实验记录"
      description: |-
        要求 experiment.create、experiment.read；普通用户须满足目标项目管理范围，负责人须为当前组织有效用户。
        所有用户均须保证目标项目属于当前组织；超级管理员仅跳过项目管理成员检查。
        初始状态固定 not_started，自动生成实验编号，并保存计划时间、参与人和 ELN 字段。
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              allOf:
                -
                  "$ref": "#/components/schemas/ExperimentCreate"
                -
                  "$ref": "#/components/schemas/RecordWrite"
      responses:
        "201":
          "$ref": "#/components/responses/Experiment"
        default:
          "$ref": "#/components/responses/ApiError"
  "/experiments/{experimentKey}":
    parameters:
      -
        "$ref": "#/components/parameters/ExperimentKey"
    get:
      operationId: "getExperiment"
      tags: ["Experiments"]
      summary: "按实验编号获取详情及版本"
      description: "要求 experiment.read 权限及实验可见性；当前不支持以 UUID 替代实验编号。"
      responses:
        "200":
          "$ref": "#/components/responses/Experiment"
        default:
          "$ref": "#/components/responses/ApiError"
    patch:
      operationId: "updateExperiment"
      tags: ["Experiments"]
      summary: "按版本保存实验及电子记录"
      description: |-
        要求 experiment.update、experiment.read 且 can_edit=true；已完成实验返回 403，不允许修订。
        普通用户具备 experiment.create 权限时仍须满足实验写入范围；无此权限时仅负责人或参与人可写，并且不能变更 project_id、owner_id。普通用户变更项目另需新项目管理范围。
        所有用户变更 project_id 时均先校验目标项目属于当前组织；超级管理员仅跳过项目管理成员检查。
        name、project_id、owner_id、experiment_type、phase、purpose 缺省时沿用现值。
        estimated_start/estimated_end 缺省时沿用现值，空串或 null 清空；未带偏移量时按 Asia/Shanghai 解释。
        ELN 和 participant_ids 均按字段增量更新：省略或 null 保留，数组传 []、文本传空串可显式清空。ELN 字段在请求顶层，不是嵌套 record。
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        -
          "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              allOf:
                -
                  "$ref": "#/components/schemas/ExperimentPatch"
                -
                  "$ref": "#/components/schemas/RecordWrite"
      responses:
        "200":
          "$ref": "#/components/responses/Experiment"
        "412":
          "$ref": "#/components/responses/ApiError"
        "428":
          "$ref": "#/components/responses/ApiError"
        default:
          "$ref": "#/components/responses/ApiError"
  "/experiments/{experimentKey}/copy":
    parameters:
      -
        "$ref": "#/components/parameters/ExperimentKey"
    post:
      operationId: "copyExperiment"
      tags: ["Experiments"]
      summary: "复制实验计划"
      description: "要求 experiment.create、experiment.read 及源项目创建范围；复制基础信息、计划时间、参与人、配方和过程，状态重置为 not_started，结果正文及附件不复制。"
      responses:
        "201":
          "$ref": "#/components/responses/Experiment"
        default:
          "$ref": "#/components/responses/ApiError"
  "/experiments/{experimentKey}/attachments":
    parameters:
      -
        "$ref": "#/components/parameters/ExperimentKey"
    post:
      operationId: "uploadExperimentAttachment"
      tags: ["Experiments"]
      summary: "上传实验附件"
      description: "要求实验可编辑。服务端忽略 multipart MIME，按扩展名白名单和基础文件头校验正文；process_image 仅接受不超过 10 MiB 的 JPG/PNG，result_file 使用项目文档相同的格式白名单且不超过 25 MiB。正文保存到 PostgreSQL，成功后实验版本递增。"
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              required: ["file","kind"]
              properties:
                file:
                  type: "string"
                  format: "binary"
                kind:
                  type: "string"
                  enum: ["process_image","result_file"]
      responses:
        "201":
          "$ref": "#/components/responses/Experiment"
        default:
          "$ref": "#/components/responses/ApiError"
  "/experiments/{experimentKey}/attachments/{attachmentId}":
    parameters:
      -
        "$ref": "#/components/parameters/ExperimentKey"
      -
        name: "attachmentId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
    delete:
      operationId: "deleteExperimentAttachment"
      tags: ["Experiments"]
      summary: "删除实验附件"
      description: "要求实验可编辑；只删除指定实验下的附件及其数据库正文，成功后实验版本递增。"
      responses:
        "200":
          "$ref": "#/components/responses/Experiment"
        default:
          "$ref": "#/components/responses/ApiError"
  "/experiments/{experimentKey}/attachments/{attachmentId}/content":
    parameters:
      -
        "$ref": "#/components/parameters/ExperimentKey"
      -
        name: "attachmentId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
    get:
      operationId: "getExperimentAttachmentContent"
      tags: ["Experiments"]
      summary: "读取实验附件正文"
      description: "要求 experiment.read 及实验可见性；响应为原始二进制正文。"
      responses:
        "200":
          description: "附件原始正文"
          content:
            "application/octet-stream":
              schema:
                type: "string"
                format: "binary"
        default:
          "$ref": "#/components/responses/ApiError"
  "/experiments/{experimentKey}/transition":
    parameters:
      -
        "$ref": "#/components/parameters/ExperimentKey"
    post:
      operationId: "transitionExperiment"
      tags: ["Experiments"]
      summary: "按顺序推进实验状态"
      description: |-
        要求 experiment.transition、experiment.read、experiment.update 及实验写入范围。
        仅支持 not_started → in_progress → completed，禁止跳级或回退。
        非法迁移返回 409，版本不匹配返回 412；已完成实验先被只读检查拒绝，返回 403。
        状态迁移设置 started_at 或 completed_at，并递增版本。
      security:
        -
          cookieAuth: []
          csrfCookie: []
          csrfHeader: []
        -
          basicAuth: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        -
          "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["target_status"]
              properties:
                target_status:
                  type: "string"
                  enum: ["in_progress","completed"]
      responses:
        "200":
          "$ref": "#/components/responses/Experiment"
        "409":
          "$ref": "#/components/responses/ApiError"
        "412":
          "$ref": "#/components/responses/ApiError"
        "428":
          "$ref": "#/components/responses/ApiError"
        default:
          "$ref": "#/components/responses/ApiError"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "JSESSIONID"
      description: "Servlet Session 默认 Cookie 名；服务器配置可覆盖"
    basicAuth:
      type: "http"
      scheme: "basic"
      description: "当前 SecurityConfig 启用的 HTTP Basic；写请求仍受 CSRF 约束"
    csrfCookie:
      type: "apiKey"
      in: "cookie"
      name: "csrftoken"
      description: "先调用 GET /auth/csrf 获取并保留"
    csrfHeader:
      type: "apiKey"
      in: "header"
      name: "X-CSRFToken"
      description: "与当前 csrftoken Cookie 匹配的令牌"
  parameters:
    Page:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        default: 1
      description: "页码从 1 开始，低于 1 按 1 处理"
    PageSize:
      name: "page_size"
      in: "query"
      schema:
        type: "integer"
        default: 20
      description: "每页数量，服务端归一化到 1 至 100"
    Search:
      name: "search"
      in: "query"
      schema:
        type: "string"
      description: "关键字模糊筛选，具体搜索列以接口查询实现为准"
    UserId:
      name: "userId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
      description: "当前组织用户主键"
    ProjectKey:
      name: "projectKey"
      in: "path"
      required: true
      schema:
        type: "string"
      description: "项目 UUID 字符串或 PRJ 业务编号"
    DocumentId:
      name: "documentId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
      description: "项目文档主键"
    ExperimentKey:
      name: "experimentKey"
      in: "path"
      required: true
      schema:
        type: "string"
      description: "EXP 实验业务编号，不是 UUID"
    IfMatch:
      name: "If-Match"
      in: "header"
      required: true
      schema:
        type: "string"
        example: "\"1\""
      description: "使用最新 ETag 或带引号的 version 整数。整数解析失败返回 428，版本冲突返回 412；当前缺失请求头由通用异常处理兜底，不能承诺与格式错误同样返回 428。"
  responses:
    ApiError:
      description: "业务或参数错误为 Problem Details 兼容对象；安全过滤器返回 status/code/detail；未分类异常返回内部错误。通常 401 为未认证、403 为权限或 CSRF 失败、404 为资源不可见或不存在。当前媒体类型为 application/json，不能假定所有非法输入均为 400。"
      content:
        "application/json":
          schema:
            anyOf:
              -
                "$ref": "#/components/schemas/ProblemDetail"
              -
                "$ref": "#/components/schemas/SecurityError"
              -
                "$ref": "#/components/schemas/InternalError"
    EmptySuccess:
      description: "操作成功；当前 NON_NULL 配置省略空 data，仅返回 request_id"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Envelope"
    Session:
      description: "当前认证用户及权限"
      content:
        "application/json":
          schema:
            allOf:
              -
                "$ref": "#/components/schemas/Envelope"
              -
                type: "object"
                required: ["data"]
                properties:
                  data:
                    "$ref": "#/components/schemas/SessionUser"
    Project:
      description: "项目详情及最新 ETag"
      headers:
        ETag:
          description: "带双引号的版本整数"
          schema:
            type: "string"
            example: "\"1\""
      content:
        "application/json":
          schema:
            allOf:
              -
                "$ref": "#/components/schemas/Envelope"
              -
                type: "object"
                required: ["data"]
                properties:
                  data:
                    "$ref": "#/components/schemas/Project"
    Follow:
      description: "当前用户的项目关注状态"
      content:
        "application/json":
          schema:
            allOf:
              -
                "$ref": "#/components/schemas/Envelope"
              -
                type: "object"
                required: ["data"]
                properties:
                  data:
                    type: "object"
                    required: ["is_followed"]
                    properties:
                      is_followed:
                        type: "boolean"
    Experiment:
      description: "实验详情、电子记录、编辑权限和最新 ETag"
      headers:
        ETag:
          description: "带双引号的版本整数"
          schema:
            type: "string"
            example: "\"1\""
      content:
        "application/json":
          schema:
            allOf:
              -
                "$ref": "#/components/schemas/Envelope"
              -
                type: "object"
                required: ["data"]
                properties:
                  data:
                    "$ref": "#/components/schemas/Experiment"
    DocumentBinary:
      description: "原始文件字节，无 JSON 信封。Content-Type 使用保存的上传 MIME 类型；无法解析时回退 application/octet-stream。包括 PDF、办公文档、image/webp 等实际上传类型，不保证转换或格式安全。"
      headers:
        Content-Disposition:
          description: "inline 或 attachment，并携带文件名"
          schema:
            type: "string"
        Content-Length:
          description: "原始正文的字节数"
          schema:
            type: "integer"
            format: "int64"
            minimum: 0
      content:
        "*/*":
          schema:
            type: "string"
            format: "binary"
  schemas:
    Envelope:
      type: "object"
      required: ["request_id"]
      properties:
        request_id:
          type: "string"
          description: "当前响应生成的标识"
          format: "uuid"
      description: "非空业务数据通过 data 返回；空 data 按当前 NON_NULL 配置省略。"
    PageEnvelope:
      allOf:
        -
          "$ref": "#/components/schemas/Envelope"
        -
          type: "object"
          required: ["meta"]
          properties:
            meta:
