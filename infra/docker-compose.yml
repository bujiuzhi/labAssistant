name: materials-lab-assistant

services:
  frontend:
    image: node:24-bookworm-slim
    container_name: materials-lab-assistant-frontend
    restart: unless-stopped
    working_dir: /workspace
    command:
      - sh
      - -c
      - corepack pnpm install --frozen-lockfile && ./node_modules/.bin/vite --host 0.0.0.0 --port 5173
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - "../frontend:/workspace"
      - "materials_lab_frontend_node_modules:/workspace/node_modules"
    depends_on:
      api:
        condition: service_started

  api:
    image: maven:3.9.12-eclipse-temurin-25
    container_name: materials-lab-assistant-api
    restart: unless-stopped
    working_dir: /workspace
    # 清除 bind mount 中遗留的 target/classes，避免已删除迁移再次被 Flyway 发现。
    command: ["mvn", "clean", "spring-boot:run", "-Dspring-boot.run.profiles=dev"]
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: ${SERVER_PORT:-8000}
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DEV_DB}
      POSTGRES_DEV_USER: ${POSTGRES_DEV_USER}
      POSTGRES_DEV_PASSWORD: ${POSTGRES_DEV_PASSWORD}
      MATERIALS_LAB_DEVELOPMENT_PASSWORD: ${MATERIALS_LAB_DEVELOPMENT_PASSWORD:-00000000}
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-true}
      OBJECT_STORAGE_ENDPOINT_URL: http://rustfs:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET_NAME: ${OBJECT_STORAGE_BUCKET_NAME:-materials-lab-assistant}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${SERVER_PORT:-8000}:8000"
    volumes:
      - "../backend:/workspace"
      - "${MATERIALS_LAB_DATA_ROOT}/maven:/root/.m2"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  postgres:
    image: postgres:18.4-alpine
    container_name: materials-lab-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DEV_DB}
      POSTGRES_USER: ${POSTGRES_DEV_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - "${MATERIALS_LAB_DATA_ROOT}/postgres:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DEV_USER} -d ${POSTGRES_DEV_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs-permissions:
    image: busybox:1.37.0
    container_name: materials-lab-assistant-rustfs-permissions
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - >-
        mkdir -p /rustfs/data /rustfs/logs &&
        chown -R 10001:10001 /rustfs/data /rustfs/logs
    volumes:
      - "${MATERIALS_LAB_DATA_ROOT}/rustfs:/rustfs"

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.11
    container_name: materials-lab-assistant-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      RUSTFS_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUST_LOG: error
    ports:
      - "${OBJECT_STORAGE_BIND_ADDRESS:-0.0.0.0}:${OBJECT_STORAGE_API_PORT:-19000}:9000"
      - "${OBJECT_STORAGE_BIND_ADDRESS:-0.0.0.0}:${OBJECT_STORAGE_CONSOLE_PORT:-19001}:9001"
    volumes:
      - "${MATERIALS_LAB_DATA_ROOT}/rustfs/data:/data"
      - "${MATERIALS_LAB_DATA_ROOT}/rustfs/logs:/logs"

volumes:
  materials_lab_frontend_node_modules:
