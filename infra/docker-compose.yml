name: materials-lab-assistant

services:
  postgres:
    image: postgres:18.4-alpine
    container_name: materials-lab-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - "${MATERIALS_LAB_DATA_ROOT}/postgres:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.4-alpine
    container_name: materials-lab-assistant-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - "${MATERIALS_LAB_DATA_ROOT}/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs-permissions:
    image: busybox:1.37.0
    container_name: materials-lab-assistant-rustfs-permissions
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - >-
        mkdir -p /rustfs/data /rustfs/logs &&
        chown -R 10001:10001 /rustfs/data /rustfs/logs
    volumes:
      - "${MATERIALS_LAB_DATA_ROOT}/rustfs:/rustfs"

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.11
    container_name: materials-lab-assistant-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      RUSTFS_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUST_LOG: error
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_API_PORT:-19000}:9000"
      - "127.0.0.1:${OBJECT_STORAGE_CONSOLE_PORT:-19001}:9001"
    volumes:
      - "${MATERIALS_LAB_DATA_ROOT}/rustfs/data:/data"
      - "${MATERIALS_LAB_DATA_ROOT}/rustfs/logs:/logs"
