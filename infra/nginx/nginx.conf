# 以 UID 101 运行；根文件系统可只读，仅 /tmp 需要可写。
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # 不记录查询串、Cookie、Authorization，避免把认证交换参数写入访问日志。
    log_format materials_lab '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent $request_time';
    access_log /dev/stdout materials_lab;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # 结果附件单文件上限为 300 MiB；310 MiB 为 multipart 边界留余量。
    client_max_body_size 310m;
    client_body_timeout 600s;
    send_timeout 600s;

    # Compose 重建 API 后地址可能改变，定期从 Docker DNS 重新解析服务名。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    upstream materials_lab_api {
        zone materials_lab_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    # 探针仅在容器回环监听，不暴露生产数据库或认证状态。
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /healthz {
            default_type text/plain;
            return 200 'ok\n';
        }
        location / {
            return 404;
        }
    }

    include /tmp/nginx/server.conf;
}
